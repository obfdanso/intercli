name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (server, terminal client, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 600
      - name: Show where the chat client test hangs
        if: failure()
        run: |
          sudo apt-get install -y gdb
          bash tests/run_with_server.sh build/server \
            timeout -s INT 90 gdb -batch -ex run -ex 'thread apply all bt' build/test_chat_client || true
      - name: Package
        run: cd build && cpack
      - uses: actions/upload-artifact@v4
        with:
          name: intercli-linux
          path: build/intercli-*.tar.gz

  windows:
    name: Windows (desktop app, tests, installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        shell: bash
        run: cmake -B build -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL"
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 600
      - name: Package
        run: cd build && cpack -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: intercli-windows
          path: |
            build/intercli-*.zip
            build/intercli-*.exe

  fuzz:
    name: Fuzz the parsers (one minute)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL and clang
        run: sudo apt-get update && sudo apt-get install -y libssl-dev clang
      - name: Build
        run: |
          cmake -B build -DINTERCLI_FUZZ=ON -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target fuzz_parsers -j 4
      - name: Fuzz
        run: ./build/fuzz_parsers -max_total_time=60 -max_len=4096

  release:
    name: Publish a release for a version tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, fuzz]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
